name: Build and Deploy Resume

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Compiles the resume formats completely locally using standard npm
      - name: Build Web and PDF Layouts
        run: |
          mkdir dist
          npm install -g @yamlresume/cli --unsafe-perm
          
          # Render the VSCode dark look for web, and minimal style for corporate PDF
          yamlresume build resume.yaml -o dist/index.html -t vscode
          yamlresume build resume.yaml -o dist/resume.pdf -t minimal
          
          # Inject the clean custom routing file for resume.jwong.org/pdf
          echo "/pdf /resume.pdf 302" > dist/_redirects

      # 2. Deploys natively using Cloudflare's official core wrangler tool directly
      - name: Direct Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=resume
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
