- name: Build PDF and HTML Website (Docker Container)
  run: |
    mkdir dist
    
    # Pull and spin up the production-ready YAMLResume docker environment
    # This maps your repository folder to the container to safely render outputs
    docker run --rm -v $(pwd):/home/yamlresume yamlresume/yamlresume validate resume.yaml
    
    # 1. Compile the developer-focused VSCode web layout
    docker run --rm -v $(pwd):/home/yamlresume yamlresume/yamlresume build resume.yaml -o dist/index.html -t vscode
    
    # 2. Compile the clean, corporate-grade PDF structure
    docker run --rm -v $(pwd):/home/yamlresume yamlresume/yamlresume build resume.yaml -o dist/resume.pdf -t minimal
    
    # 3. Setup a clean redirect rule for recruiters requesting a direct download path
    echo "/pdf /resume.pdf 302" > dist/_redirects

- name: Deploy to Cloudflare Pages
  uses: cloudflare/pages-action@v1
  with:
    apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    projectName: 'resume' # <-- Must match the Project Name you just set in Cloudflare
    directory: 'dist'      # <-- Pushes the compiled index.html and resume.pdf folder
    gitHubToken: ${{ secrets.GITHUB_TOKEN }}
