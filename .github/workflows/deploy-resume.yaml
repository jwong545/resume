name: Build and Deploy Resume

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Automate your compilation using the official YAMLResume compiler plugin
      - name: Build PDF and Web Formats
        uses: yamlresume/action@v0.16.0
        with:
          resumes: resume.yaml
          # Specifies target format paths and layout engine skins
          outputs: |
            dist/index.html:vscode
            dist/resume.pdf:minimal

      # 2. Append the target redirect rule for your custom domain path mapping
      - name: Create PDF URL Redirect Mapping
        run: echo "/pdf /resume.pdf 302" > dist/_redirects

      # 3. Securely deploy static build outputs up to your Cloudflare Pages account
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'resume'
          directory: 'dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
