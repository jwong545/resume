name: Build and Deploy Resume

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Web and PDF Layouts (Docker)
        run: |
          mkdir dist
          
          # 1. Mount your workspace into the official compiler container and build the layouts
          # Generates VSCode dark mode layout for web, and crisp minimal corporate style for the PDF
          docker run --rm -v $(pwd):/home/yamlresume yamlresume/yamlresume build resume.yaml -o dist/index.html -t vscode
          docker run --rm -v $(pwd):/home/yamlresume yamlresume/yamlresume build resume.yaml -o dist/resume.pdf -t minimal
          
          # 2. Append the target domain redirection pattern rules file
          echo "/pdf /resume.pdf 302" > dist/_redirects

      # 3. Direct secure static deployment up to your Cloudflare Pages account
      - name: Direct Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=resume
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
