name: Build and Deploy Resume

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Web and PDF Layouts (Docker)
        run: |
          mkdir -p dist
          
          # 1. Compile the developer-focused VSCode web layout
          # Note: The CLI uses a layout schema inside the resume configuration, 
          # but we can pass template overrides natively via standard Docker image arguments.
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v $(pwd):/home/yamlresume \
            yamlresume/yamlresume build resume.yaml -o dist/index.html
            
          # 2. Compile the clean, corporate-grade PDF structure
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v $(pwd):/home/yamlresume \
            yamlresume/yamlresume build resume.yaml -o dist/resume.pdf
            
          # 3. Create the direct download route file for Cloudflare Pages
          echo "/pdf /resume.pdf 302" > dist/_redirects

      # 4. Direct secure static deployment up to your Cloudflare Pages account
      - name: Direct Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=resume
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
