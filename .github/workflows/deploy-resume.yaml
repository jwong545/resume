name: Build and Deploy Resume

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Compiles your resume data directly into static web distribution directories
      - name: Build Web and PDF Layouts (Docker)
        run: |
          mkdir -p dist
          
          # 1. Compile the developer-focused VSCode layout EXACTLY as index.html
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v $(pwd):/home/yamlresume \
            yamlresume/yamlresume build resume.yaml -o dist/index.html
            
          # 2. Compile your corporate minimalist download asset
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v $(pwd):/home/yamlresume \
            yamlresume/yamlresume build resume.yaml -o dist/resume.pdf
            
          # 3. Establish the clean custom URL routing rules shortcut file
          echo "/pdf /resume.pdf 302" > dist/_redirects

      # 4. Push production assets out onto your globally routed Cloudflare edge network
      - name: Direct Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=resume --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
